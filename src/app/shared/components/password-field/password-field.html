<app-form-field [error]="error()" [inputId]="inputId()" [label]="label()">
  <div class="password-control">
    <svg solarLockLinear class="password-control__leading" aria-hidden="true"></svg>
    <input
      hlmInput
      class="app-input app-input--leading app-input--trailing"
      [attr.aria-describedby]="error() ? inputId() + '-error' : null"
      [attr.aria-invalid]="error() ? true : null"
      [autocomplete]="autocomplete()"
      [formControl]="control()"
      [id]="inputId()"
      [type]="visible() ? 'text' : 'password'"
      placeholder="••••••••"
    />
    <button
      hlmBtn
      class="password-control__toggle"
      size="icon-sm"
      type="button"
      variant="ghost"
      [attr.aria-label]="visible() ? 'Hide password' : 'Show password'"
      (click)="toggleVisibility()"
    >
      <svg *ngIf="visible(); else hiddenIcon" solarEyeLinear aria-hidden="true"></svg>
      <ng-template #hiddenIcon>
        <svg solarEyeClosedLinear aria-hidden="true"></svg>
      </ng-template>
    </button>
  </div>
</app-form-field>
