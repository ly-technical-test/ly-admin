<div class="form-field">
  <label hlmLabel class="form-field__label" [for]="inputId()">
    <span [class.hide-mobile]="mobileLabel()">{{ label() }}</span>
    <span *ngIf="mobileLabel()" class="show-mobile">{{ mobileLabel() }}</span>
  </label>
  <ng-content />
  <p *ngIf="error()" class="form-field__error" [id]="inputId() + '-error'">{{ error() }}</p>
</div>
